name: Release to GHCR

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Expected a version tag such as v1.0.0 or v1.0.0-rc.1' >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ needs.version.outputs.tag }}

  publish:
    needs: [version, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          persist-credentials: false
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.tag }},enable=${{ needs.version.outputs.prerelease == 'false' && !startsWith(needs.version.outputs.tag, 'v0.') }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=RIPE DB Audit
            org.opencontainers.image.description=RIPE registration and routing audit
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=release
            type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=release
      - name: Record image details
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published container image'
            printf '\n```text\n%s\n```\n' "$IMAGE_TAGS"
            printf '\nImmutable image: `%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [version, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; keeping its existing notes.'
            exit 0
          fi
          image="ghcr.io/${GH_REPO,,}"
          {
            echo 'Docker image for Linux amd64:'
            printf '\n```sh\ndocker pull %s:%s\n```\n' "$image" "${RELEASE_TAG#v}"
            printf '\nImmutable image: `%s@%s`\n' "$image" "$IMAGE_DIGEST"
          } > "$RUNNER_TEMP/release-notes.md"
          flags=(--latest)
          if [[ "$PRERELEASE" == true ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
